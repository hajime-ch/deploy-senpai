services:
  deployer:
    build: .
    # Or use pre-built image:
    # image: ghcr.io/yourusername/deploy-senpai:latest
    container_name: deploy-senpai
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Configuration
      - ./config.yaml:/app/config.yaml:ro
      # Docker socket for managing containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent data (deployment records, etc.)
      - deployer-data:/var/lib/deployer
      # Optional: init files directory
      - ./init-files:/app/init-files:ro
    environment:
      - TZ=UTC
    networks:
      - web

networks:
  web:
    name: web
    driver: bridge

volumes:
  deployer-data:
