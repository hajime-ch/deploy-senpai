# Example GitHub Actions workflow for applications using deploy-senpai
# Add this to your application repository at .github/workflows/staging.yml
#
# This file lives outside .github/workflows/, so dependabot does not update the
# action versions below — check them when you copy it.

name: Build and Deploy to Staging

on:
  push:
    branches:
      - '**'           # All branches
      - '!main'        # Except main
      - '!master'      # Except master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      subdomain: ${{ steps.branch.outputs.subdomain }}

    steps:
      # Fail before spending a build on a branch the deployer will refuse.
      # These rules mirror config.ValidateRefName and config.SanitizeBranchName;
      # if the deployer rejects the ref, no deployment exists and any URL this
      # workflow prints would be a lie.
      - name: Validate branch name and compute subdomain
        id: branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          fail() {
            echo "::error::deploy-senpai will reject the branch name '$BRANCH': $1"
            exit 1
          }

          case "$BRANCH" in
            "")   fail "it is empty" ;;
            /*)   fail "it begins with /" ;;
            */)   fail "it ends with /" ;;
            *..*) fail "it contains .." ;;
          esac

          [ "${#BRANCH}" -le 255 ] || fail "it is longer than 255 characters"

          printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$' \
            || fail "it contains characters outside [A-Za-z0-9._/-]"

          SUBDOMAIN=$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | tr '/_.' '-' \
            | sed 's/[^a-z0-9-]//g; s/^-*//; s/-*$//' \
            | cut -c1-63)

          [ -n "$SUBDOMAIN" ] || fail "it has no valid characters after sanitization"

          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        # `type=sha,prefix=` produces a bare 7-character short SHA, which is the
        # tag the deployer pulls for a branch push — it truncates the commit SHA
        # from the webhook to 7 characters. Do not replace this with the full
        # github.sha, or the deployer will look for a tag that was never pushed.
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output deployment URL
        # Values are passed through env rather than interpolated into the script.
        # A ${{ }} expression is substituted as text before bash parses the line,
        # so a branch name containing $( ) or backticks would execute inside the
        # runner. Keep every github.* value out of run: bodies.
        env:
          SUBDOMAIN: ${{ steps.branch.outputs.subdomain }}
          REPO: ${{ github.event.repository.name }}
        run: |
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your branch will be deployed to:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**https://${REPO}-${SUBDOMAIN}.staging.example.com**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_(Deployment takes ~1-2 minutes after image push)_" >> $GITHUB_STEP_SUMMARY

  # Optional: Notify when deployment is ready
  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Wait for deployment
        env:
          SUBDOMAIN: ${{ needs.build-and-push.outputs.subdomain }}
          REPO: ${{ github.event.repository.name }}
        run: |
          URL="https://${REPO}-${SUBDOMAIN}.staging.example.com"

          echo "Waiting for deployment at $URL..."
          
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" "$URL" | grep -q "200\|301\|302"; then
              echo "✅ Deployment is live!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 10
          done
          
          echo "⚠️ Deployment check timed out. It may still be starting."
          exit 0

# To comment the deployment URL on a pull request, add a separate workflow with a
# `pull_request` trigger. A step guarded by `github.event_name == 'pull_request'`
# can never run here, because this workflow is only triggered by `push`.
