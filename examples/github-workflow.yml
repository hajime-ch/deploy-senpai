# Example GitHub Actions workflow for applications using deploy-senpai
# Add this to your application repository at .github/workflows/staging.yml

name: Build and Deploy to Staging

on:
  push:
    branches:
      - '**'           # All branches
      - '!main'        # Except main
      - '!master'      # Except master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output deployment URL
        run: |
          BRANCH="${{ github.ref_name }}"
          SANITIZED=$(echo "$BRANCH" | tr '/' '-' | tr '_' '-' | tr '.' '-' | tr '[:upper:]' '[:lower:]')
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your branch will be deployed to:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**https://${{ github.event.repository.name }}-${SANITIZED}.staging.example.com**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_(Deployment takes ~1-2 minutes after image push)_" >> $GITHUB_STEP_SUMMARY

  # Optional: Notify when deployment is ready
  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Wait for deployment
        run: |
          BRANCH="${{ github.ref_name }}"
          SANITIZED=$(echo "$BRANCH" | tr '/' '-' | tr '_' '-' | tr '.' '-' | tr '[:upper:]' '[:lower:]')
          URL="https://${{ github.event.repository.name }}-${SANITIZED}.staging.example.com"
          
          echo "Waiting for deployment at $URL..."
          
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" "$URL" | grep -q "200\|301\|302"; then
              echo "✅ Deployment is live!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 10
          done
          
          echo "⚠️ Deployment check timed out. It may still be starting."
          exit 0

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const sanitized = branch.replace(/[/_\.]/g, '-').toLowerCase();
            const url = `https://${context.repo.repo}-${sanitized}.staging.example.com`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Staging Deployment Ready\n\nYour changes are deployed at:\n\n**${url}**\n\nThis deployment will be automatically removed when the branch is merged or deleted.`
            });
